name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  backend:
    name: Laravel API
    runs-on: ubuntu-latest

    # The application targets MySQL/MariaDB only; SQLite is not configured.
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: armorydb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring,pdo,pdo_mysql,mysqli,bcmath,openssl,curl,xml,zip
          coverage: none

      - name: Composer install
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: backend

      - name: Composer security audit
        run: composer audit --no-interaction
        working-directory: backend

      - name: Copy env
        run: cp .env.example .env
        working-directory: backend

      - name: App key
        run: php artisan key:generate
        working-directory: backend

      - name: Migrate (MySQL)
        run: php artisan migrate --force --seed
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: armorydb_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: PHPUnit
        run: php artisan test
        working-directory: backend
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: armorydb_test
          DB_USERNAME: root
          DB_PASSWORD: ""

  frontend:
    name: Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: NPM security audit
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
